name: NSE daily prices
on:
  schedule:
    - cron: '47 14,15,16 * * 1-5'
    - cron: '47 2 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: nse-market-pipeline
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COLLECTOR_APP_URL: ${{ vars.COLLECTOR_APP_URL }}
      CATCHUP_START: '2026-10-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'nse==5.1.3'
      - name: Get approved collector from the app
        shell: bash
        run: |
          TOKEN=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=momentum-book-collector" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$COLLECTOR_APP_URL/api/public/market-data/ingest?source=1" -o /tmp/collector.zip
          python3 -m zipfile -e /tmp/collector.zip .
      - run: python3 -m unittest discover -s collector/tests -v
      - name: Download, validate, restore and deliver
        run: python3 collector/github_pipeline.py